
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-demo
  namespace: default

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus-demo

  template:
    metadata:
      labels:
        app: prometheus-demo

    spec:
      containers:
        - name: prometheus-demo
          image: prometheus-demo:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
